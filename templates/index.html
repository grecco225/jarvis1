<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-JARVIS AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="jarvis-container" id="jarvisContainer">
        <!-- Header -->
        <header class="jarvis-header">
            <div class="logo">
                <div class="core-node"></div>
                <h1>MINI-JARVIS</h1>
            </div>
            <div class="header-actions">
                <button class="mode-toggle-btn" id="modeToggleBtn" title="Cambiar a Modo Live">
                    <span class="mode-icon">🎙️</span>
                    <span class="mode-label">MODO LIVE</span>
                </button>
                <div class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    <span id="statusText">EN ESPERA</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Visualizer Orb / Live Section -->
        <div class="visualizer-section" id="visualizerSection">
            <!-- Ripple Wave Layers para MODO LIVE -->
            <div class="wave-container" id="waveContainer">
                <div class="wave wave1"></div>
                <div class="wave wave2"></div>
                <div class="wave wave3"></div>
            </div>

            <div class="arc-reactor" id="arcReactor">
                <div class="ring outer"></div>
                <div class="ring middle"></div>
                <div class="ring inner"></div>
                <div class="core"></div>
            </div>

            <p class="subtext" id="interactivePrompt">Presiona el micrófono para hablar</p>
            <div class="live-transcript" id="liveTranscript"></div>
        </div>

        <!-- Chat History Container (Modo Chat) -->
        <div class="chat-container" id="chatContainer">
            <div class="message assistant">
                <div class="message-content">
                    <p>Hola, soy Mini-JARVIS. ¿En qué puedo ayudarte hoy?</p>
                </div>
            </div>
        </div>

        <!-- Control Bar -->
        <div class="control-bar" id="controlBar">
            <button class="btn-action mic-btn" id="recordBtn" title="Iniciar Modo Live / Hablar">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
            <input type="text" id="textInput" placeholder="Escribe un mensaje aquí..." autocomplete="off">
            <button class="btn-action send-btn" id="sendBtn" title="Enviar">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
            <button class="btn-action reset-btn" id="resetBtn" title="Reiniciar chat">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
            </button>
        </div>

        <!-- Live Controls (Solamente visibles en Modo Live) -->
        <div class="live-controls" id="liveControls">
            <button class="btn-action exit-live-btn" id="exitLiveBtn" title="Finalizar Modo Live">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
